name: Daily Autonomous Site Factory

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 AM PKT)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-daily-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js & Multi-Cloud CLIs
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel & Netlify CLIs
        run: |
          npm install -g vercel@latest netlify-cli@latest

      - name: Run Daily Site Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USER: "jibranpcccc"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python factory.py

      - name: Run Daily SEO Sentinel (IndexNow & Multi-Property Verification)
        run: |
          python daily_empire_seo_sentinel.py

      - name: Run GA4 & AI Traffic Intelligence Reporter
        run: |
          python ga4_traffic_reporter.py

      - name: Commit Updated Queue, Portfolio & Traffic Report
        run: |
          git config --global user.name "SiteEmpireFactory[bot]"
          git config --global user.email "actions@github.com"
          git add niches.json PORTFOLIO.md GA4_TRAFFIC_REPORT.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: record daily deployments and GA4 traffic report [skip ci]"
          git push origin main
