name: Daily Autonomous Site Factory

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 AM PKT)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-daily-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Site Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USER: "jibranpcccc"
        run: |
          python factory.py

      - name: Commit Updated Queue & Portfolio
        run: |
          git config --global user.name "SiteEmpireFactory[bot]"
          git config --global user.email "actions@github.com"
          git add niches.json PORTFOLIO.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: record daily 3 site deployments [skip ci]"
          git push origin main
